name: pytest

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev

      # The shell wrapper tests run the generated scripts in a live shell, and skip when the
      # shell is absent, so every supported shell must be present for them to mean anything
      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      - name: Generate the CLI manifest
        run: make codegen

      - name: Run pytest
        run: uv run pytest
